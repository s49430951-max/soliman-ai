<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soliman Ali</title>

    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: "Cairo", sans-serif;
            margin: 0;
            padding: 0;
        }

        /* --- الهيدر + اللوجو --- */
        header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background-color: #000;
            border-bottom: 2px solid #d4af37;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #d4af37; /* ذهبي */
            font-family: "Times New Roman", serif; /* خط كلاسيكي */
        }

        /* عنوان الصفحة */
        h1 {
            text-align: center;
            margin-top: 60px;
            font-size: 40px;
            color: #d4af37;
        }

        /* محتوى تجريبي */
        .box {
            width: 80%;
            margin: 40px auto;
            background: #111;
            padding: 20px;
            border: 1px solid #d4af37;
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
        }
    </style>

</head>

<body>

    <header>
        <div class="logo">C / Soliman Ali</div>
    </header>

    <h1>مرحباً بك في موقع سليمان علي</h1>

    <div class="box">
        هذا نص تجريبي… يمكنك تعديله وإضافة تصميماتك الخاصة هنا.
    </div>

</body>
</html>
