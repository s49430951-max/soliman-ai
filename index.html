<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAX AI</title>

<style>
    body {
        margin: 0;
        background: #000;
        font-family: "Cairo", sans-serif;
        color: #d4af37;
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        background: url('https://i.ibb.co/VjPQtXG/metal-dark-texture.jpg') center/cover no-repeat;
        opacity: 0.25;
        z-index: -1;
    }

    header {
        width: 100%;
        padding: 25px 40px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        background: rgba(0,0,0,0.6);
        border-bottom: 2px solid #d4af37;
        backdrop-filter: blur(6px);
    }

    .logo {
        font-size: 32px;
        font-weight: bold;
        color: #d4af37;
        text-shadow: 0 0 12px #d4af37;
        font-family: "Times New Roman", serif;
    }

    .hero {
        text-align: center;
        margin-top: 160px;
    }

    .hero h1 {
        font-size: 55px;
        color: #d4af37;
        text-shadow: 0 0 15px #d4af37;
    }

    .robot {
        width: 260px;
        margin-top: 40px;
        filter: drop-shadow(0 0 25px #d4af37);
        animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
        0% { transform: translateY(0); }
        50% { transform: translateY(-18px); }
        100% { transform: translateY(0); }
    }
</style>
</head>

<body>

<header>
    <div class="logo">M A X</div>
</header>

<section class="hero">
    <h1>مستقبل الذكاء الاصطناعي يبدأ من هنا</h1>

    <img class="robot" src="https://i.ibb.co/mGntw8n/ai-robot-gold.png">
</section>

</body>
</html>
